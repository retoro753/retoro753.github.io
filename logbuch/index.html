<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logbuch · RETORO_NEO</title>
<meta name="description" content="Logbuch: CTF-Writeups ohne Flags und kurze Notizen zu Linux, Security und Technik.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' https://retr0.goatcounter.com; connect-src 'self' https://retr0.goatcounter.com; object-src 'none'; base-uri 'self'; form-action 'none'">
<link rel="icon" href="../logo.svg" type="image/svg+xml">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="logbuch.css">
</head>
<body>

<header>
  <nav class="wrap">
    <a href="../" class="logo pixel"><img src="../logo.svg" alt="" width="24" height="24">RETORO_NEO</a>
    <div class="nav-right">
      <a href="../" class="back" data-i18n="home">‹ Startseite</a>
      <div class="lang" role="group" aria-label="Sprache / Language">
        <button type="button" data-lang="de" aria-pressed="true">DE</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </nav>
</header>

<main class="wrap">
  <p class="prompt">C:\LOGBUCH&gt; dir /all</p>
  <h1 class="pixel" data-i18n="title">Logbuch</h1>
  <p data-i18n="intro">CTF-Writeups ohne Flags und kurze Notizen: Erkenntnisse, Tipps und Erfahrungen rund um Linux, Security und Technik.</p>

  <div class="filters" id="filters" hidden>
    <div class="field">
      <label for="search" data-i18n="searchLabel">Suche</label>
      <input id="search" type="search" autocomplete="off">
    </div>
    <div class="field">
      <label for="type" data-i18n="typeLabel">Art</label>
      <select id="type">
        <option value="" data-i18n="all">Alle</option>
        <option value="writeup" data-i18n="typeWriteups">Writeups</option>
        <option value="notiz" data-i18n="typeNotes">Notizen</option>
      </select>
    </div>
    <div class="field">
      <label for="difficulty" data-i18n="diffLabel">Schwierigkeit</label>
      <select id="difficulty">
        <option value="" data-i18n="all">Alle</option>
        <option value="Easy">Easy</option>
        <option value="Medium">Medium</option>
        <option value="Hard">Hard</option>
        <option value="Insane">Insane</option>
      </select>
    </div>
  </div>
  <div class="tag-filter" id="tags" aria-label="Tags"></div>

  <div class="list">
    <div id="results"></div>
    <p class="empty pixel" id="empty"><span data-i18n="soon">Erster Eintrag in Arbeit</span><span class="cursor" aria-hidden="true">_</span></p>
    <p class="count" id="count"></p>
  </div>
</main>

<footer>
  <div class="wrap foot">
    <a href="../" data-i18n="home">‹ Startseite</a>
    <a href="../datenschutz.html" data-i18n="privacy">Datenschutz</a>
  </div>
</footer>

<script src="overview.js"></script>

<script src="../zaehler.js"></script>
</body>
</html>
