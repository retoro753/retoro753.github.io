<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Writeups · RETORO_NEO</title>
<meta name="description" content="CTF-Writeups ohne Flags: Lösungswege, Sackgassen und was ich gelernt habe.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<link rel="icon" href="../logo.svg" type="image/svg+xml">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="writeup.css">
</head>
<body>

<header>
  <nav class="wrap">
    <a href="../" class="logo pixel"><img src="../logo.svg" alt="" width="40" height="40">RETORO_NEO</a>
    <div class="nav-right">
      <a href="../" class="back" data-i18n="home">‹ Startseite</a>
      <div class="lang" role="group" aria-label="Sprache / Language">
        <button type="button" data-lang="de" aria-pressed="true">DE</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </nav>
</header>

<main class="wrap">
  <p class="prompt">C:\WRITEUPS&gt; dir /all</p>
  <h1 class="pixel">Writeups</h1>
  <p data-i18n="intro">CTF-Lösungswege ohne Flags: wie ich vorgegangen bin, was nicht geklappt hat und was ich gelernt habe.</p>

  <div class="filters" id="filters" hidden>
    <div class="field">
      <label for="search" data-i18n="searchLabel">Suche</label>
      <input id="search" type="search" autocomplete="off">
    </div>
    <div class="field">
      <label for="difficulty" data-i18n="diffLabel">Schwierigkeit</label>
      <select id="difficulty">
        <option value="" data-i18n="all">Alle</option>
        <option value="Easy">Easy</option>
        <option value="Medium">Medium</option>
        <option value="Hard">Hard</option>
        <option value="Insane">Insane</option>
      </select>
    </div>
  </div>
  <div class="tag-filter" id="tags" aria-label="Tags"></div>

  <div class="list">
    <div id="results"></div>
    <p class="empty pixel" id="empty"><span data-i18n="soon">Erstes Writeup in Arbeit</span><span class="cursor" aria-hidden="true">_</span></p>
    <p class="count" id="count"></p>
  </div>
</main>

<footer>
  <div class="wrap foot">
    <a href="../" data-i18n="home">‹ Startseite</a>
    <span>RETORO_NEO</span>
  </div>
</footer>

<script src="overview.js"></script>

</body>
</html>
